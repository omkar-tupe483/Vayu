<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vayu - Urban Air Quality & Smog Health Assistant</title>
    <meta name="description" content="Personalised, health-first air quality guidance for families navigating winter smog and urban air pollution." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://geocoding-api.open-meteo.com https://air-quality-api.open-meteo.com; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 16c4-6 10-6 14-2s8 8 10 2' fill='none' stroke='%23387780' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M6 22c3-4 8-4 12-1s6 5 8 1' fill='none' stroke='%23E88C64' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vayu_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
